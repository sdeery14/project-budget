# Optional: ProjectBudget with PostgreSQL (ADR-010). Most users want `docker run` with SQLite instead.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d
#
services:
  app:
    build: .
    image: ghcr.io/sdeery14/projectbudget:latest
    ports:
      - "8000:8000"
    environment:
      # The password travels separately and is URL-encoded by the app, so any characters work.
      PROJECTBUDGET_DATABASE_URL: postgresql+psycopg://projectbudget@db:5432/projectbudget
      PROJECTBUDGET_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: projectbudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: projectbudget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectbudget -d projectbudget"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
