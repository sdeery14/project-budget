<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProjectBudget{% endblock %}</title>
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
  <script src="{{ request.url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
  <script src="{{ request.url_for('static', path='confirm.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">ProjectBudget</a>
    {% if principal %}
    <nav aria-label="Main">
      <a href="/backlog">Backlog</a>
      <a href="/timeline">Timeline</a>
      <a href="/budget">Budget</a>
      <a href="/projects">Projects</a>
      <a href="/catalog">Catalog</a>
      <a href="/purchases">Purchases</a>
      <a href="/sync">Sync</a>
      <a href="/settings/data">Data</a>
      <a href="/settings/tokens">API tokens</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link">Log out ({{ principal.username }})</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">ProjectBudget {{ version }}</footer>
</body>
</html>
