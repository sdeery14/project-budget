<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProjectBudget{% endblock %}</title>
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
  <script src="{{ request.url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <header class="site-header">
    <a class="brand" href="/">ProjectBudget</a>
    {% if principal %}
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/settings/tokens">API tokens</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link">Log out ({{ principal.username }})</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">ProjectBudget {{ version }}</footer>
</body>
</html>
