[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "projectbudget"
dynamic = ["version"]
description = "One honest shopping backlog across all your projects, scheduled against your budget."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Sean Deery" }]
keywords = ["budget", "projects", "backlog", "forecast", "self-hosted", "maker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "typer>=0.15",
  "jinja2>=3.1",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "pyyaml>=6.0.3",
  "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/sdeery14/project-budget"
Documentation = "https://github.com/sdeery14/project-budget/tree/main/docs"
Issues = "https://github.com/sdeery14/project-budget/issues"
Changelog = "https://github.com/sdeery14/project-budget/releases"

[project.scripts]
projectbudget = "projectbudget.cli.main:app"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6",
  "hypothesis>=6.115",
  "httpx2", # Starlette's TestClient requires httpx2 and deprecates httpx
  "pre-commit>=4",
  "pip-audit>=2.7",
  "bandit>=1.8",
  "types-pyyaml>=6.0.12.20261103",
]
# Browser smoke tests (tests/e2e): a real Chromium through Playwright. Optional locally;
# `uv run playwright install chromium` downloads the browser once.
e2e = [
  "pytest-playwright>=0.6",
]

# ---------------------------------------------------------------------------
# Build: version comes from the git tag (ADR-010).
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/projectbudget"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "LICENSE", "NOTICE", "README.md"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
  "PT",  # pytest style
  "RUF", # ruff-specific
  "N",   # naming
  "S",   # bandit-style security checks
  "T20", # no stray print()
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert is the point of a test
  "S105", # fake passwords in test data are not secrets
  "S106",
]
"src/projectbudget/persistence/migrations/versions/*" = ["N999"] # Alembic names files by revision id

[tool.ruff.lint.isort]
known-first-party = ["projectbudget"]

# ---------------------------------------------------------------------------
# Types: strict everywhere the RFC requires it (domain, services) and, while
# the package is small, everywhere else too. Relax per module only with a reason.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
# Alembic revision files are named by revision id and are not importable modules.
exclude = ["^src/projectbudget/persistence/migrations/versions/"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
  "error",
  # pytest-playwright 0.7 still defines its session fixtures as instance methods (pytest 9 deprecation).
  "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]
markers = [
  "postgres: needs PROJECTBUDGET_TEST_DATABASE_URL pointing at a PostgreSQL server",
]

[tool.coverage.run]
source = ["projectbudget"]
branch = true
omit = ["*/persistence/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# Security scanning (CI "security" job)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
