name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date instead of silently re-resolving

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs reads tags for the version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    env:
      PROJECTBUDGET_TEST_DATABASE_URL: sqlite+pysqlite:///./test.sqlite
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest --cov --cov-report=term

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectbudget
          POSTGRES_PASSWORD: projectbudget
          POSTGRES_DB: projectbudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectbudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECTBUDGET_TEST_DATABASE_URL: postgresql+psycopg://projectbudget:projectbudget@localhost:5432/projectbudget_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest --cov --cov-report=term

  ui-smoke:
    name: UI smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --group e2e
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser smoke tests
        run: uv run pytest tests/e2e --browser chromium --screenshot only-on-failure --output e2e-artifacts
      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore

  docker:
    name: Container answers /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg VERSION=0.0.0.dev0 -t projectbudget:ci .
      - name: Run with SQLite on a volume and wait for /health
        run: |
          docker run -d --name pb -p 8000:8000 -v pb-data:/data projectbudget:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::/health did not answer within 30s"; docker logs pb; exit 1
      - name: Show startup log
        if: always()
        run: docker logs pb || true

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: pip-audit
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit --strict --requirement /tmp/requirements.txt
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src
