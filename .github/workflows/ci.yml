name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date instead of silently re-resolving

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs reads tags for the version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    env:
      PROJECTBUDGET_TEST_DATABASE_URL: sqlite+pysqlite:///./test.sqlite
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest --cov --cov-report=term

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectbudget
          POSTGRES_PASSWORD: projectbudget
          POSTGRES_DB: projectbudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectbudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECTBUDGET_TEST_DATABASE_URL: postgresql+psycopg://projectbudget:projectbudget@localhost:5432/projectbudget_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest --cov --cov-report=term

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: pip-audit
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit --strict --requirement /tmp/requirements.txt
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src
