name: Release

# Tagging vX.Y.Z on main publishes the PyPI package, the GHCR image and a GitHub Release
# (ADR-010). The version comes from the tag through hatch-vcs; nothing is edited by hand.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/projectbudget

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs reads the tag
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: uv build
      - name: Check the built version matches the tag
        run: |
          ls dist
          test -f "dist/projectbudget-${{ steps.version.outputs.version }}-py3-none-any.whl"
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl 2>/dev/null || uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/projectbudget version
          /tmp/smoke/bin/projectbudget --database-url sqlite+pysqlite:////tmp/smoke.sqlite db upgrade
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Publish the GHCR image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.build.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: The published image answers /health with the released version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          built="$(docker run --rm --entrypoint projectbudget "${IMAGE}:${VERSION}" version)"
          echo "projectbudget version -> ${built}"
          test "${built}" = "${VERSION}"
          docker run -d --name pb -p 8000:8000 "${IMAGE}:${VERSION}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          health="$(curl -fsS http://127.0.0.1:8000/health)"
          echo "${health}" | grep -q '"status":"ok"'
          echo "${health}" | grep -q "\"version\":\"${VERSION}\""
          docker rm -f pb

  release:
    name: GitHub Release
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            index($0, "## [" v "]") == 1 {show=1; next}
            show && index($0, "## [") == 1 {exit}
            show {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
